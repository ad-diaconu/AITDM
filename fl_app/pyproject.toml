[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitdm-fl-wisdm"
version = "0.2.0"
description = "WISDM federated learning (FedAvg / FedBN + Stage-2 strategies, DP, attackers), adapted from AITDM_FLOWER_PROJECT_TUTORIAL/fl_app"
requires-python = ">=3.11"
# The exact versions are pinned in ../requirements.txt
dependencies = ["flwr[simulation,dp]>=1.41.0", "torch>=2.4", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["aitdm_fl"]

# ---------------------------------------------------------------------------
# Flower configuration
# ---------------------------------------------------------------------------
[tool.flwr.app]
publisher = "aitdm"

[tool.flwr.app.components]
serverapp = "aitdm_fl.server_app:app"
clientapp = "aitdm_fl.client_app:app"

# Used with `flwr run` (scripts/run_simulation.sh etc.); every key can be overridden, e.g.
#   flwr run . --run-config "num-server-rounds=10 strategy='fedprox'"
# experiments/run_seeds.py passes the same keys through $AITDM_FL_CONFIG_FILE instead
# (in-process simulation, one run per fold x seed). Defaults: fl_app/aitdm_fl/task.py DEFAULTS.
[tool.flwr.app.config]
# ABSOLUTE path to one fold of a split: data/partitions/wisdm/<split>_K<K>/fold<f>
# (written by data_splitting/split_data.py). The scripts in ../scripts fill it in for you.
partitions-dir = ""
save-dir = ""              # where the server writes results.json + final_model.pt
model = "fcn"              # fcn | lstm
seed = 1                   # report mean +- std over folds 0-4 x seeds 1, 2, 3
num-server-rounds = 40
local-epochs = 1
learning-rate = 0.001
batch-size = 64
clip = 1.0                 # gradient-norm clipping in local training
patience = 10              # early stopping on federated validation macro-F1 (best-round selection)
loss-weighting = "none"    # "balanced": every client weights its loss by inverse class frequency

# Aggregation strategy (docs/04_aggregation_strategies.md):
#   fedavg | fedbn | fedprox | fedavgm | fedadam | fedyogi   (accuracy / non-IID)
#   fedmedian | fedtrimmedavg | krum                         (robustness)
#   qfedavg                                                  (fairness)
# fedbn = FedAvg aggregation, BatchNorm layers stay on the clients; local-bn = true does the
# same with any other strategy.
strategy = "fedavg"
local-bn = false
proximal-mu = 0.1           # fedprox: weight of the proximal term
server-momentum = 0.9       # fedavgm
server-lr = 0.01            # fedadam / fedyogi: server learning rate (eta)
trim-beta = 0.2             # fedtrimmedavg: fraction cut from EACH end
num-malicious = 1           # krum: number of attackers it should tolerate
qfedavg-q = 0.1             # qfedavg: 0 = FedAvg, larger = fairer
qfedavg-client-lr = 1.0     # qfedavg: step-size estimate (L = 1 / this)

# Central differential privacy (wraps any strategy). 0 = off.
dp-noise-multiplier = 0.0   # noise std = multiplier * clipping-norm / #clients
dp-clipping-norm = 1.0      # max L2 norm of a client update
dp-delta = 1e-5             # delta used to report the privacy budget epsilon

# Robustness experiments: attacking clients (comma-separated partition ids)
malicious-clients = ""      # e.g. "2" or "1,3"
attack = "sign-flip"        # "sign-flip", "noise" or "none" (honest weights)
attack-inflate-examples = 1 # attackers multiply the num-examples they report (FedAvg trusts it)

# The server waits until this many clients are connected before starting a round.
# The scripts set it to the number of clients of the split (meta.json).
min-nodes = 5
