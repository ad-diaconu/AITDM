<title>WISDM federated learning: FedAvg vs FedBN vs centralised</title>
<style>
  :root {

  .note { color: var(--muted); font-size: 12.5px; margin: 4px 0 10px; max-width: 980px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0 4px; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 150px; }
  .card .v { font-size: 22px; font-weight: 600; line-height: 28px; }

  table { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
  th, td { border-bottom: 1px solid var(--border); padding: 5px 10px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; color: var(--muted); }
  .grid { display: flex; flex-wrap: wrap; gap: 18px; }
  .panel { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 4px 0; }
  .sw { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 5px; }
  .controls { display: flex; gap: 14px; align-items: center; margin: 6px 0; font-size: 13px; }
  select, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 8px; }
  svg text { fill: var(--fg); font-family: inherit; }
  svg .axis { stroke: var(--border); }
  svg .tick { fill: var(--muted); font-size: 11px; }
  code { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); font-size: 12px; }
  details summary { cursor: pointer; color: var(--muted); margin: 6px 0; }
  .tip { position: fixed; pointer-events: none; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; display: none; z-index: 9; }
</style>

function axes(svg, W, H, m, x0, x1, y0, y1, xlabel, ylabel, xticks, yticks) {
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  svg.append(S("line", { x1: m.l, y1: H - m.b, x2: W - m.r, y2: H - m.b, class: "axis" }),
             S("line", { x1: m.l, y1: m.t, x2: m.l, y2: H - m.b, class: "axis" }));
  for (const t of xticks) svg.append(S("text", { x: X(t), y: H - m.b + 14, "text-anchor": "middle", class: "tick" }, t));
  for (const t of yticks) { svg.append(S("text", { x: m.l - 5, y: Y(t) + 4, "text-anchor": "end", class: "tick" }, +t.toFixed(2)),
    S("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), class: "axis", "stroke-dasharray": "2 3", opacity: .5 })); }
  if (xlabel) svg.append(S("text", { x: (m.l + W - m.r) / 2, y: H - 4, "text-anchor": "middle", class: "tick" }, xlabel));
  if (ylabel) svg.append(S("text", { x: 12, y: (m.t + H - m.b) / 2, transform: `rotate(-90 12 ${(m.t + H - m.b) / 2})`, "text-anchor": "middle", class: "tick" }, ylabel));
  return [X, Y];
}
const ticks = (lo, hi, n) => { const s = (hi - lo) / n; return Array.from({ length: n + 1 }, (_, i) => lo + i * s); };
const title = (svg, x, t) => svg.append(S("text", { x, y: 14, "font-weight": 600, "font-size": 13 }, t));

function lineChart(series, { heading, ylabel, ymin, ymax, vline, hlines = [], W = 470, H = 250 }) {
  const svg = S("svg", { width: W, height: H }), n = Math.max(...series.map(s => s.mean.length));
  const m = { l: 46, r: 12, t: 22, b: 34 };
  const [X, Y] = axes(svg, W, H, m, 1, n, ymin, ymax, "round", ylabel, [1, ...ticks(0, n, 4).slice(1).map(Math.round)], ticks(ymin, ymax, 4));
  title(svg, m.l, heading);
  const clip = v => Math.max(ymin, Math.min(ymax, v));
  if (vline) svg.append(S("line", { x1: X(vline), x2: X(vline), y1: m.t, y2: H - m.b, stroke: "var(--muted)", "stroke-dasharray": "4 3" }),
    S("text", { x: X(vline) + 4, y: m.t + 10, class: "tick" }, "mean best round"));
  for (const h of hlines) { svg.append(S("line", { x1: m.l, x2: W - m.r, y1: Y(h.y), y2: Y(h.y), stroke: h.color, "stroke-dasharray": "6 4", opacity: .8 }),
    S("text", { x: W - m.r - 4, y: Y(h.y) - 4, "text-anchor": "end", class: "tick" }, h.label)); }
  for (const s of series) {
    const up = s.mean.map((v, i) => `${X(i + 1)},${Y(clip(v + s.std[i]))}`), lo = s.mean.map((v, i) => `${X(i + 1)},${Y(clip(v - s.std[i]))}`).reverse();
    svg.append(S("polygon", { points: up.concat(lo).join(" "), fill: s.color, opacity: .12 }));
    svg.append(S("polyline", { points: s.mean.map((v, i) => `${X(i + 1)},${Y(clip(v))}`).join(" "), fill: "none", stroke: s.color, "stroke-width": 2, "stroke-dasharray": s.dash || "" }));
    s.mean.forEach((v, i) => { const c = S("circle", { cx: X(i + 1), cy: Y(clip(v)), r: 5, fill: "transparent" });
      hover(c, `<b>${s.label}</b> · round ${i + 1}<br>${f3(v)} ± ${f3(s.std[i])}`); svg.append(c); });
  }
  return svg;
}

function heatmap(cm, normalise, col, heading) {
  const k = cm.length, cell = 40, m = { l: 80, t: 30, b: 66, r: 6 };
  const W = m.l + k * cell + m.r, H = m.t + k * cell + m.b, svg = S("svg", { width: W, height: H });
  title(svg, 4, heading);
  const rows = cm.map(r => r.reduce((a, b) => a + b, 0));
  for (let i = 0; i < k; i++) for (let j = 0; j < k; j++) {
    const frac = rows[i] ? cm[i][j] / rows[i] : 0, g = S("g");
    g.append(S("rect", { x: m.l + j * cell, y: m.t + i * cell, width: cell - 2, height: cell - 2, rx: 3, fill: col, "fill-opacity": Math.max(.04, frac), stroke: i === j ? col : "none" }));
    g.append(S("text", { x: m.l + j * cell + cell / 2 - 1, y: m.t + i * cell + cell / 2 + 4, "text-anchor": "middle", "font-size": 11, "font-weight": i === j ? 600 : 400 },
      normalise ? (frac * 100).toFixed(0) : cm[i][j]));
    hover(g, `true <b>${C[i]}</b> → predicted <b>${C[j]}</b><br>${cm[i][j]} windows (${(frac * 100).toFixed(1)}% of row)`);
    svg.append(g);
  }
  C.forEach((c, i) => { svg.append(S("text", { x: m.l - 5, y: m.t + i * cell + cell / 2 + 4, "text-anchor": "end", "font-size": 11.5 }, c));
    const x = m.l + i * cell + cell / 2, y = m.t + k * cell + 6; svg.append(S("text", { x, y, transform: `rotate(40 ${x} ${y})`, "font-size": 11.5 }, c)); });
  return svg;
}

function bars(groups, series, { heading, ylabel, ymin = 0, ymax = 1, W = 900, H = 270, refs = [] }) {
  // groups: [{label, values: {series: {mean, std}}}], series: [names]
  const svg = S("svg", { width: W, height: H }), m = { l: 46, r: 10, t: 22, b: 40 };
  const [, Y] = axes(svg, W, H, m, 0, 1, ymin, ymax, "", ylabel, [], ticks(ymin, ymax, 5));
  title(svg, m.l, heading);
  const gw = (W - m.l - m.r) / groups.length, bw = (gw - 14) / series.length;
  groups.forEach((g, gi) => {
    const lines = g.label.split("\n");
    lines.forEach((t, li) => svg.append(S("text", { x: m.l + gi * gw + gw / 2, y: H - m.b + 14 + li * 13, "text-anchor": "middle", "font-size": 11.5 }, t)));
    series.forEach((sname, si) => { const s = g.values[sname]; if (!s) return;
      const x = m.l + gi * gw + 7 + si * bw, v = Math.max(ymin, s.mean);
      const r = S("rect", { x, y: Y(v), width: bw - 2, height: Y(ymin) - Y(v), fill: color(sname), "fill-opacity": dashed(sname) ? .45 : .9, rx: 2,
        stroke: color(sname), "stroke-dasharray": dashed(sname) ? "3 2" : "" });
      hover(r, `<b>${label(sname)}</b> · ${g.label.replace("\n", " ")}<br>${pm(s)}`); svg.append(r);
      const cx = x + (bw - 2) / 2; svg.append(S("line", { x1: cx, x2: cx, y1: Y(Math.min(ymax, s.mean + s.std)), y2: Y(Math.max(ymin, s.mean - s.std)), stroke: "var(--fg)", "stroke-width": 1.1 })); });
  });
  return svg;
}

function strip(groups, { heading, W = 980, H = 280 }) {
  // groups: [{name, values: [f1], sizes: [users]}]
  const svg = S("svg", { width: W, height: H }), m = { l: 46, r: 10, t: 22, b: 58 };
  const [, Y] = axes(svg, W, H, m, 0, 1, 0, 1, "", "client test macro-F1", [], ticks(0, 1, 5));
  title(svg, m.l, heading);
  const gw = (W - m.l - m.r) / groups.length;
  groups.forEach((g, gi) => {
    const cx = m.l + gi * gw + gw / 2;
    label(g.name).replace(" (", " · (").split(" · ").forEach((t, li) => svg.append(S("text", { x: cx, y: H - m.b + 13 + li * 12, "text-anchor": "middle", "font-size": 10.5 }, t)));
    g.values.forEach((v, i) => { const jitter = ((i * 37) % 23 - 11) / 11 * gw * 0.28;
      const c = S("circle", { cx: cx + jitter, cy: Y(v), r: Math.min(7, 2 + Math.sqrt(g.sizes[i] || 1)), fill: color(g.name), "fill-opacity": .45 });
      hover(c, `<b>${label(g.name)}</b><br>client F1 ${f3(v)} · ${g.sizes[i]} test users`); svg.append(c); });
    const sorted = [...g.values].sort((a, b) => a - b), med = sorted[Math.floor(sorted.length / 2)];
    svg.append(S("line", { x1: cx - gw * .35, x2: cx + gw * .35, y1: Y(med), y2: Y(med), stroke: "var(--fg)", "stroke-width": 2 }));
  });
  return svg;
}

function stacked(clients, { heading, W = 520, H = 250 }) {
  const svg = S("svg", { width: W, height: H }), m = { l: 46, r: 110, t: 22, b: 36 };
  const [, Y] = axes(svg, W, H, m, 0, 1, 0, 1, "client (fold 0)", "share of training windows", [], ticks(0, 1, 4));
  title(svg, m.l, heading);
  const cols = ["var(--fcn)", "var(--lstm)", "var(--c-test)", "var(--c-val)", "var(--c-train)", "var(--muted)"];
  const bw = (W - m.l - m.r) / clients.length;
  clients.forEach((c, i) => { let acc = 0;
    c.share.forEach((s, j) => { const r = S("rect", { x: m.l + i * bw + 6, y: Y(acc + s), width: bw - 12, height: Y(acc) - Y(acc + s), fill: cols[j] });
      hover(r, `client ${i} · <b>${C[j]}</b>: ${(s * 100).toFixed(1)}%<br>${c.train_windows} windows, ${c.train_users} users`); svg.append(r); acc += s; });
    svg.append(S("text", { x: m.l + i * bw + bw / 2, y: H - m.b + 14, "text-anchor": "middle", class: "tick" }, `${i} (${c.train_users}u)`)); });
  C.forEach((c, j) => { svg.append(S("rect", { x: W - m.r + 10, y: m.t + j * 18, width: 10, height: 10, fill: cols[j] }),
    S("text", { x: W - m.r + 25, y: m.t + j * 18 + 9, "font-size": 11.5 }, c)); });
  return svg;
}

].map(([a, b]) => `<tr><td>${a}</td><td style="text-align:left">${b}</td></tr>`).join("")));

add(el("h2", {}, "Protocol"));
add(el("table", {}, [["Clients", "K = 5 (primary), K = 3 (sensitivity), full participation; train, val and test users assigned to clients"],
  ["Rounds / local epochs", "R = 40, E = 1 (ablation E = 3, R = 14); Adam lr 1e-3 re-initialised each round, batch 64, grad-clip 1.0"],
  ["Aggregation", "FedAvg weighted by training windows. FedBN = FedAvg for conv/linear weights, BN γ, β and running statistics stay on the client"],
  ["Selection", "Best round on federated validation macro-F1 (summed confusion counts), early stopping with patience 10 applied to the curve"],
  ["Normalisation", "z-score with the fold's pooled training mean/std (federated sums), identical to the centralised baseline"],
  ["LSTM", "No BatchNorm layers, so FedBN = FedAvg; only FedAvg is run"]].map(([a, b]) => `<tr><td>${a}</td><td style="text-align:left">${b}</td></tr>`).join("")));
add(el("p", { class: "note" }, "See docs/experiment_setup_federated.md. Data, folds and models: docs/experiment_setup_centralised_baseline.md."));
